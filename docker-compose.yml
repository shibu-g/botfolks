# Production: everything behind nginx (Cloudflare Full strict)
services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    env_file: .env
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mariadb
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      VECTOR_MODE: native
      QUEUE_MODE: redis
    volumes: [uploads:/app/uploads]
    depends_on:
      mariadb: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mariadb
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      VECTOR_MODE: native
      QUEUE_MODE: redis
    volumes: [uploads:/app/uploads]
    depends_on:
      mariadb: { condition: service_healthy }
      redis: { condition: service_started }

  dashboard:
    build: { context: ., dockerfile: apps/dashboard/Dockerfile }
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./apps/widget/dist:/usr/share/nginx/widget:ro
      - ./apps/site/dist:/usr/share/nginx/site:ro
    depends_on: [api, dashboard]

volumes:
  mariadb_data:
  redis_data:
  uploads:
