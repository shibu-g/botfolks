# Cloudflare Origin Certificate -> nginx/certs/origin.pem + origin-key.pem
ssl_certificate     /etc/nginx/certs/origin.pem;
ssl_certificate_key /etc/nginx/certs/origin-key.pem;
ssl_protocols TLSv1.2 TLSv1.3;

server {
  listen 80;
  server_name botfolks.in *.botfolks.in;
  return 301 https://$host$request_uri;
}

# Marketing site
server {
  listen 443 ssl;
  http2 on;
  server_name botfolks.in www.botfolks.in;
  root /usr/share/nginx/site;
  location / { try_files $uri $uri/ /index.html; }
}

# Dashboard
server {
  listen 443 ssl;
  http2 on;
  server_name app.botfolks.in;
  location / { proxy_pass http://dashboard:80; }
}

# API (SSE streaming needs buffering off)
server {
  listen 443 ssl;
  http2 on;
  server_name api.botfolks.in;
  location / {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}

# Widget CDN
server {
  listen 443 ssl;
  http2 on;
  server_name widget.botfolks.in;
  root /usr/share/nginx/widget;
  add_header Access-Control-Allow-Origin *;
  add_header Cache-Control "public, max-age=3600";
}
